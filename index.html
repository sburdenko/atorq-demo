<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Atorq</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10141c;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* The game is portrait-only. The canvas is held at the phone's aspect and fitted to whatever
         window it lands in, so a desktop browser shows a phone rather than stretching a portrait
         layout across a landscape frame. */
      #shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        display: block;
        background: #10141c;
        border-radius: 10px;
        /* Sized in script: aspect-ratio alone cannot also cap BOTH axes on every browser. */
      }

      #unity-loading-bar {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        color: #8c9bb2;
        font-size: 14px;
        letter-spacing: 2px;
      }

      #unity-progress-bar-empty {
        width: 220px;
        height: 6px;
        margin: 14px auto 0;
        background: #222a38;
        border-radius: 3px;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #ffbe3c;
        transition: width 0.2s;
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        z-index: 10;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="unity-loading-bar">
      LOADING
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // iPhone X. Every screen the game is reviewed on is close enough to this that one aspect is
      // simpler than a responsive canvas, and the UI is authored against it.
      var ASPECT = 1125 / 2436;

      function fitCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var width = Math.min(w, h * ASPECT);
        var height = width / ASPECT;

        // Backing store follows the CSS size times DPR, so text stays sharp on a retina screen
        // instead of being upscaled from a 1x buffer.
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }

      fitCanvas();
      window.addEventListener("resize", fitCanvas);

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement('div');
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == 'error') div.style = 'background: #c0392b; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #d4a017; padding: 10px;';
          setTimeout(function () { banner.removeChild(div); }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/atorq-demo.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/atorq-demo.data.unityweb",
        frameworkUrl: buildUrl + "/atorq-demo.framework.js.unityweb",
        codeUrl: buildUrl + "/atorq-demo.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Atorq",
        productName: "Atorq",
        productVersion: "0.9.1",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(() => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          fitCanvas();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
