<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atorq</title>
  <!-- viewport-fit=cover clears the iPhone notch; locking scale stops a stray pinch during a drag
       from zooming the page instead of aiming a throw. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0e16">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0b0e16;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* the game reads drags; without this the browser steals them as scroll/pull-to-refresh */
      overscroll-behavior: none;
      touch-action: none;
    }
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* The game is authored portrait 1080x1920. The canvas is held to that aspect and fitted inside
       the viewport, so a phone fills the screen and a desktop shows a centred portrait panel
       instead of stretching the scene into a letterbox. */
    #canvas {
      display: block;
      aspect-ratio: 1080 / 1920;
      height: 100%;
      max-width: 100%;
      width: auto;
      background: #0b0e16;
    }
    @media (max-aspect-ratio: 1080/1920) {
      #canvas { width: 100%; height: auto; max-height: 100%; }
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0b0e16; color: #96a2b8; gap: 22px; transition: opacity .4s; z-index: 10;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #brand { font-size: 34px; font-weight: 700; letter-spacing: 10px; color: #f5f7fc; }
    #bar { width: 210px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.10); overflow: hidden; }
    #fill { width: 0%; height: 100%; background: #ff9e2c; transition: width .2s; }
    #hint { font-size: 13px; letter-spacing: 1px; }
    #error {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 32px; background: #0b0e16; color: #f05a4e; text-align: center;
      font-size: 15px; line-height: 1.6; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="canvas" tabindex="-1"></canvas></div>

  <div id="loading">
    <div id="brand">ATORQ</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="hint">loading…</div>
  </div>
  <div id="error"></div>

  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/build.data.unityweb",
      frameworkUrl: buildUrl + "/build.framework.js.unityweb",
      codeUrl: buildUrl + "/build.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Atorq",
      productName: "Atorq",
      productVersion: "1.0"
    };

    var canvas  = document.querySelector("#canvas");
    var loading = document.querySelector("#loading");
    var fill    = document.querySelector("#fill");
    var errorEl = document.querySelector("#error");

    function fail(message) {
      loading.classList.add("hidden");
      errorEl.style.display = "flex";
      errorEl.textContent = message;
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/build.loader.js";
    script.onerror = function () { fail("Could not load the game files."); };
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (progress * 100) + "%";
      }).then(function () {
        loading.classList.add("hidden");
      }).catch(function (err) {
        fail("This browser could not start the game.\n\n" + err);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
